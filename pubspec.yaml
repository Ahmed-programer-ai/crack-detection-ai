name: crackai
description: Offline building crack screening with on-device YOLO segmentation.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  onnxruntime: ^1.4.1
  image_picker: ^1.2.4
  image: ^4.12.0
  sqflite: ^2.4.5
  path_provider: ^2.1.6
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/crack_seg.onnx
    - assets/data/knowledge_base.json
